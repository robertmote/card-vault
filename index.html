<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card Vault</title>
<!-- home-screen app: name, icon and full-screen launch when added from the phone's browser -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --bg:#0b0b0c; --panel:#151516; --line:#2a2a2d; --text:#ece7dc; --dim:#9a958a; --cream:#f3ead2; --ink:#1b1a17;
          --up:#7fbf7f; --down:#d77a6f; --serif:Georgia, 'Iowan Old Style', 'Palatino Linotype', serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, sans-serif; padding-bottom:76px; }
  main { max-width:640px; margin:0 auto; padding:16px; padding-top:max(16px, env(safe-area-inset-top)); } /* clear the phone's status bar when opened from the home screen */
  h1, .lbl { font:600 11px/1.2 system-ui; color:var(--dim); margin:0; text-transform:uppercase; letter-spacing:.16em; }
  .total { font:400 38px/1.15 var(--serif); margin-top:4px; }
  .up { color:var(--up); } .down { color:var(--down); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin:12px 0; }
  .ranges button, .tabs button { background:none; border:0; color:var(--dim); font:inherit; padding:6px 10px; border-radius:6px; cursor:pointer; }
  .ranges button.on { background:var(--line); color:var(--text); }
  svg { width:100%; height:120px; display:block; }
  .sub { color:var(--dim); font-size:13px; }
  .right { text-align:right; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
  .stats b { display:block; font:400 19px var(--serif); } .stats span { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.1em; }
  input, select { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; }
  .btn { background:var(--cream); color:var(--ink); border:0; border-radius:8px; padding:10px 14px; font:inherit; font-weight:600; cursor:pointer; }
  .btn.ghost { background:#1f1f21; color:var(--text); border:1px solid var(--line); }
  .btn:disabled { opacity:.6; cursor:progress; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tabs { position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:center; gap:24px; background:#101011; border-top:1px solid var(--line); padding:8px 10px calc(8px + env(safe-area-inset-bottom)); }
  .tabs button { font:400 16px var(--serif); }
  .tabs button.on { color:var(--cream); box-shadow:inset 0 -2px var(--cream); border-radius:0; }
  label { display:block; font-size:13px; color:var(--dim); margin:8px 0 4px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .hidden { display:none !important; }
  :focus-visible { outline:2px solid var(--cream); outline-offset:2px; }
  .busy { opacity:.5; cursor:progress; }
  [role=button] { cursor:pointer; }
  .brk { padding:8px 0; border-bottom:1px solid var(--line); } .brk:last-child { border:0; }
  .brk .top { display:flex; justify-content:space-between; gap:8px; } .brk b { font:400 16px var(--serif); }
  .meter { height:4px; background:var(--line); border-radius:2px; margin-top:6px; } .meter div { height:100%; border-radius:2px; }

  /* ballistic nylon: two crossed hairline weaves over the binder's colour */
  .nylon, .cover { background:repeating-linear-gradient(45deg, #ffffff08 0 1px, transparent 1px 3px),
                                repeating-linear-gradient(-45deg, #00000045 0 1px, transparent 1px 3px), var(--c, #1a1a1c); }

  /* header: plain on the shelf, a zippered binder cover once a binder is open */
  .head { display:flex; gap:10px; align-items:flex-start; position:relative; }
  .head .grow { flex:1; min-width:0; }
  .head.cover { border:1px solid #ffffff14; border-radius:14px; padding:12px 22px 12px 10px; box-shadow:0 3px 10px #0008; }
  .head.cover .total { font-size:30px; }
  .head .zip { display:none; }
  .head.cover .zip { display:block; position:absolute; right:7px; top:10px; bottom:10px; width:5px; border-radius:3px; background:repeating-linear-gradient(#3a3a3e 0 2px, #111 2px 4px); }
  .iconbtn { background:#0006; color:var(--text); border:1px solid #ffffff1c; border-radius:50%; width:36px; height:36px; font:20px/1 system-ui; cursor:pointer; flex:none; }
  details.menu { position:relative; }
  details.menu summary { list-style:none; display:grid; place-items:center; }
  details.menu summary::-webkit-details-marker { display:none; }
  details.menu div { position:absolute; right:0; top:42px; z-index:5; background:#1f1f21; border:1px solid var(--line); border-radius:10px; padding:4px; min-width:160px; box-shadow:0 8px 20px #000a; }
  details.menu div button { display:block; width:100%; text-align:left; background:none; border:0; color:var(--text); font:inherit; padding:9px 10px; border-radius:6px; cursor:pointer; }
  details.menu div button:hover { background:var(--line); }

  /* shelf of binders, spines out */
  .shelf { display:flex; align-items:flex-end; gap:5px; padding:16px 10px 0; min-height:182px; margin-top:14px; border-radius:4px 4px 0 0;
           background:linear-gradient(#121212, #1b1712); border-bottom:12px solid #3a2a1b; box-shadow:0 8px 8px -6px #000; }
  .spine { width:48px; padding:12px 0 8px; border:1px solid #ffffff14; border-radius:3px 3px 0 0; color:var(--text); display:flex; flex-direction:column;
           align-items:center; justify-content:space-between; gap:6px; cursor:pointer; font:inherit; box-shadow:inset -6px 0 8px -6px #0009, inset 6px 0 8px -6px #ffffff10; }
  .spine .t { writing-mode:vertical-rl; transform:rotate(180deg); font:15px var(--serif); letter-spacing:.03em; max-height:100px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .spine .v { font:700 9px system-ui; background:var(--cream); color:var(--ink); padding:2px 3px; border-radius:2px; }
  .spine.add { background:none; border:1px dashed #3d3d40; color:#77736b; justify-content:center; font:24px system-ui; box-shadow:none; height:150px; }
  /* the binder before the empty space leans over, as real ones do */
  .shelf:last-child .spine:nth-last-child(2):nth-child(-n+4) { transform:rotate(5deg); transform-origin:bottom left; margin-right:12px; }

  /* opening a binder: a layer over the page that the animation pieces live on (transform/opacity only) */
  .fx { position:fixed; inset:0; z-index:50; perspective:1400px; }
  .fx-bg { position:absolute; inset:0; background:var(--bg); }
  .fx .spine { position:fixed; margin:0; box-shadow:0 14px 24px #000c; will-change:transform; }
  .fx-book { position:fixed; display:grid; place-items:center; border:1px solid #ffffff14; border-radius:14px; box-shadow:0 18px 40px #000c; backface-visibility:hidden; will-change:transform, opacity; }
  .fx-book .t { font:400 28px var(--serif); padding:0 28px; text-align:center; }
  .fx-book .zip { position:absolute; right:7px; top:12px; bottom:12px; width:5px; border-radius:3px; background:repeating-linear-gradient(#3a3a3e 0 2px, #111 2px 4px); }

  /* binder pages: native horizontal scroll with one snap point per page = swipe on touch, arrows on PC */
  .pages { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain; margin-top:12px; }
  .pages::-webkit-scrollbar { display:none; }
  .sheet { flex:0 0 100%; scroll-snap-align:start; scroll-snap-stop:always; position:relative; background:#121213; border-radius:6px; padding:12px 12px 12px 32px; box-shadow:inset 0 0 0 1px #262628; }
  .holes { position:absolute; left:10px; top:0; bottom:0; display:flex; flex-direction:column; justify-content:space-around; }
  .holes i { width:11px; height:11px; border-radius:50%; background:var(--bg); box-shadow:inset 0 1px 2px #000, 0 0 0 1px #2c2c2f; }
  .grid9 { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .pocket { position:relative; aspect-ratio:63/88; background:#0d0d0e; border:1px solid #2b2b2e; border-radius:2px; overflow:hidden; }
  .pocket img { width:100%; height:100%; object-fit:cover; display:block; }
  .pocket::after { content:''; position:absolute; inset:0; pointer-events:none; background:linear-gradient(120deg, #ffffff1c 0%, transparent 30%, transparent 70%, #ffffff0d 100%); }
  .pocket.empty::before { content:''; position:absolute; inset:14% 18%; border:1px dashed #2f2f33; border-radius:3px; }
  .pocket .noimg { position:absolute; inset:0; display:grid; place-items:center; padding:8px; text-align:center; font:13px var(--serif); color:var(--dim); }
  .grid .noimg { display:grid; place-items:center; aspect-ratio:63/88; padding:8px; margin-bottom:4px; border-radius:5px; background:#0007; border:1px dashed #ffffff22; text-align:center; font:13px var(--serif); color:var(--dim); }
  .tag { position:absolute; right:4px; bottom:4px; z-index:1; background:var(--cream); color:var(--ink); font:700 10px/1 system-ui; padding:3px 4px; border-radius:2px; transform:rotate(-3deg); box-shadow:0 1px 2px #0008; }
  .tag i { font-style:normal; margin-left:2px; } .tag .up { color:#2f7a3a; } .tag .down { color:#a8392c; }
  .qty, .slab { position:absolute; left:4px; top:4px; z-index:1; background:#000b; color:var(--text); font:700 10px/1 system-ui; padding:3px 4px; border-radius:2px; }
  .slab { top:auto; bottom:4px; }
  .pager { display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
  .pager .iconbtn { width:44px; height:44px; background:#1a1a1c; }
  .pager .iconbtn:disabled { opacity:.3; cursor:default; }
  #pg { font:11px system-ui; letter-spacing:.12em; color:var(--dim); text-transform:uppercase; text-align:center; }

  /* search: deck-box tabs over a felt playmat */
  .chips { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--line); margin-bottom:12px; }
  .chip { flex:none; white-space:nowrap; background:#1a1a1c; color:var(--dim); border:1px solid var(--line); border-bottom:0; border-radius:8px 8px 0 0; font:inherit; padding:8px 11px; cursor:pointer; }
  .chip.on { background:var(--cream); color:var(--ink); }
  .mat { margin-top:12px; padding:14px; border-radius:14px; min-height:200px; border:1px solid #1f2a25;
         background:repeating-radial-gradient(circle at 30% 20%, #ffffff03 0 1px, transparent 1px 3px), radial-gradient(ellipse at 50% 25%, #1c2a23, #0e1512); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(105px,1fr)); gap:14px 10px; }
  .grid div { font-size:12px; color:#b9c2bc; }
  .grid img { width:100%; aspect-ratio:63/88; object-fit:cover; border-radius:5px; background:#0007; box-shadow:0 4px 8px #0009; display:block; margin-bottom:4px; }
  .grid div:nth-child(3n+1) img { transform:rotate(-1.5deg); } .grid div:nth-child(3n+2) img { transform:rotate(1deg); }

  /* profile: collector ID card */
  .idcard { border-radius:14px; overflow:hidden; border:1px solid #3a362d; background:linear-gradient(135deg, #1f1e1b, #141414); box-shadow:0 6px 16px #0009; margin:12px 0; }
  .idtop { background:linear-gradient(90deg, #a89259, #eadfb2, #9c8a5a); color:var(--ink); font:700 10px system-ui; letter-spacing:.2em; text-transform:uppercase; padding:7px 14px; }
  .idbody { display:flex; gap:14px; padding:14px; align-items:center; }
  .avatar { width:80px; height:96px; margin:0; border-radius:6px; background:#2a2823; display:grid; place-items:center; overflow:hidden; cursor:pointer; font:34px var(--serif); color:var(--cream); border:1px solid #3a362d; }
  .avatar img { width:100%; height:100%; object-fit:cover; }
  .linkbtn { background:none; border:0; color:var(--dim); font:inherit; font-size:12px; cursor:pointer; margin-top:4px; }
  .idstats { display:grid; grid-template-columns:1fr 1fr; border-top:1px dashed #3a362d; text-align:center; padding:10px 0; }
  .idstats b { display:block; font:400 20px var(--serif); } .idstats span { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.1em; }

  /* dialogs: the editor shows the card in a top-loader above a cream price-tag form */
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:14px; width:min(420px,94vw); max-height:94vh; padding:14px; }
  dialog::backdrop { background:#000b; }
  .loader { width:172px; margin:0 auto 10px; padding:14px 6px 6px; border-radius:6px; background:#ffffff0d; border:1px solid #ffffff2a; box-shadow:inset 0 0 0 1px #ffffff10, 0 6px 14px #0008; }
  .loader img { width:100%; display:block; border-radius:4px; }
  .dtitle { text-align:center; } .dtitle b { font:400 19px var(--serif); }
  .tagform { position:relative; background:var(--cream); color:var(--ink); border-radius:10px; padding:18px 14px 14px; margin-top:12px; }
  .tagform::before { content:''; position:absolute; top:7px; left:50%; width:10px; height:10px; margin-left:-5px; border-radius:50%; background:var(--panel); box-shadow:inset 0 1px 2px #0008; }
  .tagform label { color:#6b6455; }
  .tagform input, .tagform select { background:#fffaf0; color:var(--ink); border-color:#cfc5ab; }
  .tagform .btn { background:var(--ink); color:var(--cream); }
  .tagform .btn.ghost { background:#e4d9bd; color:var(--ink); border-color:#cfc5ab; }
  .swatches { display:flex; gap:10px; margin:6px 0 4px; }
  .swatches label { margin:0; width:34px; height:34px; border-radius:50%; background:var(--c); border:3px solid var(--l); cursor:pointer; }
  .swatches input { position:absolute; opacity:0; width:0; }
  .swatches label:has(:checked) { box-shadow:0 0 0 3px var(--bg), 0 0 0 5px var(--cream); }
  .swatches label:has(:focus-visible) { outline:2px solid var(--cream); outline-offset:4px; }

  /* scanner: full-screen camera with corner guides, a mode switch on top and a sheet that slides up from the bottom */
  dialog.scan { width:100vw; height:100dvh; max-width:none; max-height:none; margin:0; padding:0; border:0; border-radius:0; background:#000; overflow:hidden; }
  .scan video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .scan .guide { position:absolute; left:50%; top:46%; width:min(62vw, 300px, 38dvh); aspect-ratio:63/88; transform:translate(-50%,-50%); }
  .scan .guide i { position:absolute; width:28px; height:28px; border:3px solid var(--cream); }
  .scan .guide i:nth-child(1) { left:0; top:0; border-right:0; border-bottom:0; border-radius:8px 0 0 0; }
  .scan .guide i:nth-child(2) { right:0; top:0; border-left:0; border-bottom:0; border-radius:0 8px 0 0; }
  .scan .guide i:nth-child(3) { left:0; bottom:0; border-right:0; border-top:0; border-radius:0 0 0 8px; }
  .scan .guide i:nth-child(4) { right:0; bottom:0; border-left:0; border-top:0; border-radius:0 0 8px 0; }
  .readout { position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%); width:max-content; max-width:88vw; margin:0; background:#000b; padding:5px 12px; border-radius:16px; font-size:12px; text-align:center; }
  .scantop { position:absolute; top:calc(12px + env(safe-area-inset-top)); left:12px; right:12px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .seg { display:flex; background:#000a; border-radius:20px; padding:3px; }
  .seg button { background:none; border:0; color:#bbb; font:inherit; font-size:13px; padding:6px 12px; border-radius:16px; cursor:pointer; }
  .seg button[aria-pressed=true] { background:var(--cream); color:var(--ink); font-weight:600; }
  .scanopts { position:absolute; top:calc(60px + env(safe-area-inset-top)); left:12px; right:12px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  .scanopts select, .scanopts .btn { width:auto; margin:0; padding:6px 10px; font-size:13px; font-weight:400; background:#000a; color:var(--text); border:1px solid #ffffff2a; border-radius:16px; }
  .scansheet { max-height:62dvh; overflow-y:auto; position:absolute; left:0; right:0; bottom:0; max-width:640px; margin:0 auto; background:var(--panel); border-top:1px solid var(--line); border-radius:18px 18px 0 0;
           padding:14px 14px calc(14px + env(safe-area-inset-bottom)); transform:translateY(110%); transition:transform .28s cubic-bezier(.2,.8,.2,1); }
  .scansheet.open { transform:none; }
  .scansheet .res { display:flex; gap:12px; align-items:center; } .scansheet .res img, .scansheet .res .noimg { width:70px; border-radius:4px; flex:none; }
  .scansheet .nm { font:400 19px var(--serif); } .scansheet .px { font:400 26px var(--serif); margin-top:2px; }
  .scansheet .btns { display:flex; gap:8px; margin-top:12px; } .scansheet .btns .btn { flex:1; }
  .alts { margin-top:10px; font-size:12px; color:var(--dim); }
  .alts button { margin:4px 4px 0 0; padding:4px 9px; border:1px solid var(--line); border-radius:12px; background:none; color:var(--text); font:inherit; cursor:pointer; }
  .tray { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; min-height:64px; }
  .tray button { position:relative; flex:none; width:46px; padding:0; border:0; background:none; cursor:pointer; }
  .tray img, .tray .noimg { width:46px; aspect-ratio:63/88; object-fit:cover; border-radius:3px; display:block; font-size:8px; }
  .tray b { position:absolute; right:2px; bottom:2px; background:var(--cream); color:var(--ink); font:700 8px system-ui; padding:2px 3px; border-radius:2px; }
  .tray button:last-child img { outline:2px solid var(--up); }
  .tot { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .note { display:flex; gap:10px; align-items:center; justify-content:space-between; background:#1f3324; border:1px solid #6fae7f; border-radius:10px; padding:6px 10px; margin-bottom:10px; font-size:13px; }
  .note button { background:none; border:0; color:var(--cream); text-decoration:underline; font:inherit; cursor:pointer; }
  @media (prefers-reduced-motion: reduce) { .scansheet { transition:none; } }
</style>
</head>
<body>
<main>
  <section id="portfolio">
    <header class="head" id="head">
      <button class="iconbtn hidden" id="back" aria-label="Back to shelf">‹</button>
      <div class="grow">
        <div class="lbl" id="headLbl">Your collection</div>
        <div class="total" id="total">$0.00</div>
        <div id="change"></div>
      </div>
      <details class="menu hidden" id="menu">
        <summary class="iconbtn" aria-label="Binder options">⋯</summary>
        <div><button data-act="rename">Rename binder</button><button data-act="color">Change colour</button><button data-act="delete">Delete binder</button></div>
      </details>
      <span class="zip" aria-hidden="true"></span>
    </header>

    <div id="binder" class="hidden">
      <div class="pages" id="pages" aria-label="Binder pages"></div>
      <div class="pager">
        <button class="iconbtn" id="prev" aria-label="Previous page">‹</button>
        <span id="pg" aria-live="polite"></span>
        <button class="iconbtn" id="next" aria-label="Next page">›</button>
      </div>
    </div>

    <div class="panel">
      <svg id="chart" role="img" aria-label="Value chart" viewBox="0 0 300 100" preserveAspectRatio="none"></svg>
      <div class="ranges" id="ranges"></div>
    </div>
    <div class="panel stats">
      <div><b id="count">0</b><span>Cards</span></div>
      <div><b id="cost">$0</b><span>Cost basis</span></div>
      <div><b id="gain">$0</b><span>Gain / loss</span></div>
    </div>

    <div id="shelves"></div>

    <div class="bar" style="margin-top:14px">
      <select id="sort" style="width:auto" aria-label="Sort cards"><option value="value">Sort: value</option><option value="gain">Sort: gain</option><option value="name">Sort: name</option><option value="added">Sort: recently added</option></select>
      <span class="bar" style="margin-left:auto"><button class="btn ghost hidden" id="scanBinder">Scan</button><button class="btn" id="refresh">Refresh prices</button></span>
    </div>
    <p id="status" class="sub" aria-live="polite"></p>
    <div class="actions" style="justify-content:flex-start">
      <button class="btn ghost" id="export">Export backup</button>
      <label class="btn ghost" style="margin:0" role="button" tabindex="0">Import backup<input type="file" id="import" accept=".json" hidden></label>
    </div>
  </section>

  <section id="search" class="hidden">
    <div class="chips">
      <button class="chip on" aria-pressed="true" data-game="pokemon">Pokémon</button>
      <button class="chip" aria-pressed="false" data-game="mtg">Magic</button>
      <button class="chip" aria-pressed="false" data-game="ygo">Yu-Gi-Oh!</button>
      <button class="chip" aria-pressed="false" data-game="custom">Sports / Other</button>
    </div>
    <form id="searchForm" class="bar" style="flex-wrap:nowrap"><input id="q" type="search" aria-label="Search cards" placeholder="Search cards by name…" autocomplete="off" style="flex:1;min-width:0"><button type="button" class="btn ghost" id="scanOpen">Scan</button></form>
    <div class="mat">
      <p id="searchMsg" class="sub" aria-live="polite" style="margin-top:0">Search for a card, then tap it to add it to a binder.</p>
      <div class="grid" id="results"></div>
    </div>
  </section>

  <section id="profile" class="hidden">
    <div class="idcard">
      <div class="idtop">Card Vault · Collector ID</div>
      <div class="idbody">
        <div style="text-align:center">
          <label class="avatar" title="Change photo" role="button" tabindex="0" aria-label="Change profile photo"><img id="pPhoto" alt=""><span id="pInitials"></span><input type="file" id="pPhotoIn" accept="image/*" hidden></label>
          <button class="linkbtn" id="pPhotoDel">Remove photo</button>
        </div>
        <div style="flex:1;display:grid;gap:8px">
          <input id="pName" placeholder="Username" maxlength="30" autocomplete="nickname" aria-label="Username">
          <input id="pEmail" type="email" placeholder="Email address" autocomplete="email" aria-label="Email address">
        </div>
      </div>

<script>
const $ = s => document.querySelector(s);
const USD = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }); // one shared formatter; toLocaleString built a new one per call
const usd = n => n == null ? '—' : USD.format(n);
const SHORT = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', notation: 'compact', maximumFractionDigits: 1 });
const tagUsd = n => n == null ? '—' : n < 100 ? USD.format(n) : SHORT.format(n); // price stickers: $8.40, $477, $1.3K
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ESC[ch]);
const byName = new Intl.Collator().compare; // much faster than localeCompare inside a sort
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };

let cards = load('cards', []);      // {key, game, id, name, set, img, thumb, variant, market, col, qty, cond, grader, grade, manual, cost, price, prevPrice, added}
let history = load('history', []);  // {t, v: all-binders total, by: {binder: total}}
let collections = load('collections', ['Main']); // binder names, in shelf order
let colors = load('colors', {});    // {binder: colour name from COLORS}
let profile = load('profile', {});  // {name, email, photo (small JPEG data URL)}
// cur is the open binder's name, or 'All' while looking at the shelf.
let game = 'pokemon', range = 30, editing = null, editPrices = {}, cur = 'All', page = 0, view = [], T = null, searchCtl = null;

// Binder nylon colours: [cover/spine, lighter shade for meters and swatch rings].
const COLORS = { Black: ['#1a1a1c', '#8d8a84'], Navy: ['#1d2a44', '#6f8fc9'], Red: ['#3a1717', '#c9706a'], Green: ['#1f3324', '#6fae7f'], Tan: ['#4a3d28', '#c8ab72'] };
const colorOf = n => COLORS[colors[n]] ?? COLORS.Black;

// Older saves kept every printing's price on every card (~1 KB each, enough to fill browser storage at a few
// thousand cards). Now a card stores only its chosen printing's market price; the full list is fetched when editing.
const THUMB = { pokemon: u => u.replace('/high.webp', '/low.webp'), mtg: u => u.replace('/normal/', '/small/'), ygo: u => u.replace('/cards/', '/cards_small/') };
function migrate(c) {
  c.col ??= collections[0]; c.cond ??= 'Near Mint';
  c.key ??= crypto.randomUUID(); c.qty = Math.max(1, Math.round(+c.qty) || 1); // hand-edited backups: missing key, "2" as text
  if (!collections.includes(c.col)) collections.push(c.col); // otherwise its cards could never be selected
  if (c.prices) { c.market ??= c.prices[c.variant] ?? null; delete c.prices; }
  c.thumb ??= THUMB[c.game]?.(c.img || '') ?? c.img;
}
const oldFormat = cards.some(c => c.prices || c.thumb === undefined);
cards.forEach(migrate);

// Writes only the keys that changed; re-serializing everything (photo included) on every edit was wasted work.
function save(...keys) {
  const all = { cards, history, collections, colors, profile };
  try { for (const k of keys.length ? keys : Object.keys(all)) localStorage.setItem(k, JSON.stringify(all[k])); }
  catch (e) { tell(`Couldn't save (${e.name}). Browser storage may be full, so export a backup now.`); }
}
navigator.storage?.persist?.(); // ask the browser not to clear this site's storage when disk runs low
// Another open tab saved: reload, so this tab's stale copy can't overwrite those changes on its next save.
const DATA = ['cards', 'history', 'collections', 'colors', 'profile'];
addEventListener('storage', e => e.storageArea === localStorage && (e.key === null || DATA.includes(e.key)) && location.reload());

// Network errors surface as a bare TypeError ("Failed to fetch"); say what it means.
const why = e => e.name === 'TypeError' ? "couldn't reach the site, check your connection" : 'error ' + e.message;
// Small session cache so reopening a card shows every printing at once. Cleared on refresh.
const cached = (map, k, f) => { if (!map.has(k)) map.set(k, f().catch(e => { map.delete(k); throw e; })); return map.get(k); };
const details = new Map();
const getCard = (g, id) => cached(details, g + ':' + id, () => sources[g].get(id));

// ponytail: flat condition discounts off the Near Mint market price, roughly TCGplayer's typical spread.
// Real per-condition prices need a paid API; use "Your value" when it matters.
const COND = { 'Near Mint': 1, 'Lightly Played': 0.85, 'Moderately Played': 0.7, 'Heavily Played': 0.5, 'Damaged': 0.35 };
$('#dCond').innerHTML = Object.keys(COND).map(k => `<option>${k}</option>`).join('');
$('#askColors').innerHTML = Object.entries(COLORS).map(([k, [c, l]]) =>
  `<label style="--c:${c};--l:${l}" title="${k}"><input type="radio" name="bc" value="${k}" aria-label="${k}"></label>`).join('');

// Each card's price per copy: your own value wins, then market × condition (graded cards skip the condition discount).
const unitPrice = c => c.manual != null ? c.manual
  : c.market == null ? null : +(c.market * (c.grader ? 1 : COND[c.cond] ?? 1)).toFixed(2);

// --- Price sources: TCGdex (Pokémon), Scryfall (MTG), YGOPRODeck (Yu-Gi-Oh!). All free, no key, TCGplayer USD prices. ---
async function getJSON(url, opts) { const r = await fetch(url, opts); if (!r.ok) throw new Error(r.status); return r.json(); }
const chunk = (a, n) => Array.from({ length: Math.ceil(a.length / n) }, (_, i) => a.slice(i * n, i * n + n));
const pause = ms => new Promise(r => setTimeout(r, ms));

const pkPrices = d => {
  const p = {};
  for (const [k, v] of Object.entries(d.pricing?.tcgplayer || {})) if (v?.marketPrice != null) p[k] = v.marketPrice;
  return p;
};
const mtgPrices = c => {
  const p = {};
  if (c.prices.usd) p.normal = +c.prices.usd;
  if (c.prices.usd_foil) p.foil = +c.prices.usd_foil;
  if (c.prices.usd_etched) p.etched = +c.prices.usd_etched;
  return p;
};
const ygoPrices = c => {
  const p = {}, any = +c.card_prices?.[0]?.tcgplayer_price;
  if (any) p['Cheapest printing'] = any;
  for (const s of c.card_sets || []) if (+s.set_price) p[`${s.set_code} ${s.set_rarity}`] = +s.set_price;
  return p;
};
const mtgImg = (c, size) => (c.image_uris || c.card_faces?.[0]?.image_uris || {})[size] || '';

// get(id) → one card's details. getMany(ids, onProgress) → Map(id → prices) for a price refresh.
const sources = {
  pokemon: {
    async search(q, signal) {
      const list = await getJSON(`https://api.tcgdex.net/v2/en/cards?name=${encodeURIComponent(q)}&pagination:itemsPerPage=60`, { signal });
      return list.filter(c => c.image).map(c => ({ id: c.id, name: c.name, img: c.image + '/low.webp', sub: c.id }));
    },
    async get(id) {
      const d = await getJSON(`https://api.tcgdex.net/v2/en/cards/${encodeURIComponent(id)}`);
      return { name: d.name, set: `${d.set?.name ?? ''} · ${d.localId}`, img: d.image ? d.image + '/high.webp' : '',
               thumb: d.image ? d.image + '/low.webp' : '', prices: pkPrices(d) };
    },
    // TCGdex has no batch endpoint, so run 6 requests at a time instead of one after another.
    async getMany(ids, onProgress) {
      const out = new Map();
      let next = 0;
      await Promise.all(Array.from({ length: 6 }, async () => {
        for (let id; (id = ids[next++]) != null; onProgress(1)) {
          try { out.set(id, (await this.get(id)).prices); } catch (e) { console.warn('TCGdex price fetch failed', id, e); }
        }
      }));
      return out;
    },
  },
  mtg: {
    async search(q, signal) {
      const r = await fetch(`https://api.scryfall.com/cards/search?unique=prints&q=${encodeURIComponent(q)}`, { signal });
      if (r.status === 404) return [];
      if (!r.ok) throw new Error(r.status);
      return (await r.json()).data.map(c => ({ id: c.id, name: c.name, img: mtgImg(c, 'small'), sub: `${c.set.toUpperCase()} #${c.collector_number}` }));
    },
    async get(id) {
      const c = await getJSON(`https://api.scryfall.com/cards/${encodeURIComponent(id)}`);
      return { name: c.name, set: `${c.set_name} · #${c.collector_number}`, img: mtgImg(c, 'normal'), thumb: mtgImg(c, 'small'), prices: mtgPrices(c) };
    },
    // Scryfall's /cards/collection returns up to 75 cards per request.
    async getMany(ids, onProgress) {
      const out = new Map();
      for (const part of chunk(ids, 75)) {
        try {
          const r = await getJSON('https://api.scryfall.com/cards/collection', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifiers: part.map(id => ({ id })) }) });
          for (const c of r.data) out.set(c.id, mtgPrices(c));
        } catch (e) { console.warn('Scryfall batch failed', e); }
        onProgress(part.length);
        await pause(100); // Scryfall asks for 50–100 ms between requests
      }
      return out;
    },
  },
  ygo: {
    async search(q, signal) {
      const r = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?fname=${encodeURIComponent(q)}&num=60&offset=0`, { signal });
      if (r.status === 400) return []; // YGOPRODeck answers "no match" with a 400
      if (!r.ok) throw new Error(r.status);
      return (await r.json()).data.map(c => ({ id: c.id, name: c.name, img: c.card_images?.[0]?.image_url_small, sub: c.type }));
    },
    async get(id) {
      const c = (await getJSON(`https://db.ygoprodeck.com/api/v7/cardinfo.php?id=${encodeURIComponent(id)}`)).data[0];
      return { name: c.name, set: c.type, img: c.card_images?.[0]?.image_url, thumb: c.card_images?.[0]?.image_url_small, prices: ygoPrices(c) };
    },
    // YGOPRODeck accepts a comma-separated id list.
    async getMany(ids, onProgress) {
      const out = new Map();
      for (const part of chunk(ids, 50)) {
        try {
          const r = await getJSON(`https://db.ygoprodeck.com/api/v7/cardinfo.php?id=${part.map(encodeURIComponent).join(',')}`);
          for (const c of r.data) out.set(String(c.id), ygoPrices(c));
        } catch (e) { console.warn('YGOPRODeck batch failed', e); }
        onProgress(part.length);
        await pause(60); // stays under their 20 requests/second limit
      }
      return out;
    },
  },
};

// --- Portfolio ---
const value = c => (c.price || 0) * c.qty;
const GAMES = { pokemon: 'Pokémon', mtg: 'Magic', ygo: 'Yu-Gi-Oh!', custom: 'Sports / Other' };

// One pass over the cards gives every total the UI needs.
function tally() {
  const blank = () => ({ qty: 0, val: 0, cost: 0 });
  const t = { all: blank(), view: blank(), col: Object.fromEntries(collections.map(n => [n, blank()])), game: {} };
  const add = (b, c, v, k) => { b.qty += c.qty; b.val += v; b.cost += k; };
  for (const c of cards) {
    const v = value(c), k = (c.cost || 0) * c.qty;
    add(t.all, c, v, k); add(t.col[c.col] ??= blank(), c, v, k); add(t.game[c.game] ??= blank(), c, v, k);
    if (cur === 'All' || c.col === cur) add(t.view, c, v, k);
  }
  return t;
}

function snapshot(t) {
  const now = Date.now(), last = history.at(-1);
  const pt = { t: now, v: +t.all.val.toFixed(2), by: Object.fromEntries(collections.map(n => [n, +t.col[n].val.toFixed(2)])) };
  // ponytail: one point per hour max, keeps localStorage small
  if (last && now - last.t < 36e5) Object.assign(last, pt); else history.push(pt);
  save('cards', 'history');
}
// Every change to cards ends the same way: total once, record the history point, redraw.
function commit() { const t = tally(); snapshot(t); render(t); if ($('#scan').open && scanMode === 'add') renderTray(); } // the scan tray follows edits too

// Rendering is split so a sort change only redraws the pages, and a range change only the chart.
function render(t = tally()) { T = t; renderSummary(t); renderChart(t); cur === 'All' ? renderShelf(t) : renderPages(); }

function renderSummary(t) {
  const shelf = cur === 'All';
  for (const id of ['#back', '#menu', '#binder', '#sort', '#scanBinder']) $(id).classList.toggle('hidden', shelf);
  $('#shelves').classList.toggle('hidden', !shelf);
  $('#head').classList.toggle('cover', !shelf);
  $('#head').style.setProperty('--c', colorOf(cur)[0]);
  $('#headLbl').textContent = shelf ? 'Your collection' : cur;

  // Profile always covers every binder, whatever is open on the Binders tab.
  $('#pCount').textContent = t.all.qty;
  $('#pValue').textContent = usd(t.all.val);
  breakdown('#pByCol', collections.map(n => [n, t.col[n], colorOf(n)[1]]), t.all.val);
  breakdown('#pByGame', Object.entries(GAMES).filter(([g]) => t.game[g]).map(([g, label]) => [label, t.game[g], 'var(--cream)']), t.all.val);

  const g = t.view.val - t.view.cost;
  $('#total').textContent = usd(t.view.val);
  $('#count').textContent = t.view.qty;
  $('#cost').textContent = usd(t.view.cost);
  $('#gain').textContent = usd(g); $('#gain').className = g >= 0 ? 'up' : 'down';
}

function breakdown(el, groups, all) {
  $(el).innerHTML = groups.map(([label, b, color]) => {
    const pct = all ? b.val / all * 100 : 0;
    return `<div class="brk"><div class="top"><div>${esc(label)}<div class="sub">${b.qty} cards</div></div>
      <div class="right"><b>${usd(b.val)}</b><div class="sub">${pct.toFixed(1)}%</div></div></div>
      <div class="meter"><div style="width:${pct}%;background:${color}"></div></div></div>`;
  }).join('') || '<p class="sub">No cards yet.</p>';
}

function renderChart(t) {
  const total = t.view.val, since = range ? Date.now() - range * 864e5 : 0, pts = [];
  for (const h of history) { const v = cur === 'All' ? h.v : h.by?.[cur]; if (h.t >= since && v != null) pts.push({ t: h.t, v }); }
  const first = pts[0]?.v ?? total, diff = total - first;
  $('#chart').setAttribute('aria-label', pts.length > 1 ? `Value chart: ${diff >= 0 ? 'up' : 'down'} ${usd(Math.abs(diff))} over ${range ? range + ' days' : 'all time'}` : 'Value chart: not enough history yet');
  $('#change').innerHTML = pts.length > 1
    ? `<span class="${diff >= 0 ? 'up' : 'down'}">${diff >= 0 ? '▲' : '▼'} ${usd(Math.abs(diff))} (${first ? (diff / first * 100).toFixed(2) : '0.00'}%)</span> <span class="sub">${range ? range + 'D' : 'all time'}</span>`
    : '<span class="sub">Refresh prices over time to build your chart</span>';
  drawChart(pts, diff >= 0);
  $('#ranges').innerHTML = [[7, '7D'], [30, '1M'], [90, '3M'], [365, '1Y'], [0, 'ALL']]
    .map(([d, l]) => `<button data-r="${d}" class="${d === range ? 'on' : ''}" aria-pressed="${d === range}">${l}</button>`).join('');
}

function drawChart(pts, up) {
  const svg = $('#chart');
  if (pts.length < 2) return svg.innerHTML = '';
  // ponytail: stride-sample to ~the chart's 300 px width; a year of hourly points was 8,000+ SVG vertices
  const step = Math.ceil(pts.length / 300);
  if (step > 1) pts = pts.filter((_, i) => i % step === 0 || i === pts.length - 1);
  let lo = Infinity, hi = -Infinity; // a loop, since Math.min(...bigArray) can overflow the call stack
  for (const p of pts) { if (p.v < lo) lo = p.v; if (p.v > hi) hi = p.v; }
  const t0 = pts[0].t, t1 = pts.at(-1).t;
  const xy = pts.map(p => `${((p.t - t0) / (t1 - t0 || 1) * 300).toFixed(1)},${(95 - (p.v - lo) / (hi - lo || 1) * 90).toFixed(1)}`).join(' ');
  const col = up ? 'var(--up)' : 'var(--down)';
  svg.innerHTML = `<polygon points="0,100 ${xy} 300,100" fill="${col}" opacity=".12"/><polyline points="${xy}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
}

// --- The shelf: one spine per binder, 6 slots to a shelf ---
const hash = s => [...s].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7);
function renderShelf(t) {
  const spines = collections.map(n => {
    const b = t.col[n], [c] = colorOf(n);
    // height varies a little per binder (stable, from its name) so the row doesn't look machine-made
    return `<button class="spine nylon" data-bind="${esc(n)}" style="--c:${c};height:${146 + hash(n) % 20}px" aria-label="Open ${esc(n)}: ${b.qty} cards, ${usd(b.val)}">
      <span class="t">${esc(n)}</span><span class="v">${tagUsd(b.val)}</span></button>`;
  });
  spines.push('<button class="spine add" id="addBinder" aria-label="New binder">+</button>');
  $('#shelves').innerHTML = chunk(spines, 6).map(row => `<div class="shelf">${row.join('')}</div>`).join('');
}
$('#shelves').onclick = e => {
  if (e.target.closest('#addBinder')) return newBinder();
  const b = e.target.closest('[data-bind]');
  if (b) openBinder(b);
};

// Opening a binder: the spine slides up off the shelf, turns face-on as it grows to full size, then the cover
// swings open on its left edge to show the pages. Going back plays the same steps in reverse. Only transform
// and opacity animate, so it stays smooth on phones.
const MS = { pull: 220, turn: 380, open: 480 }; // tune the feel here
const EASE = 'cubic-bezier(.2,.8,.2,1)', SWING = 'cubic-bezier(.5,0,.3,1)';
const LIFT = 'translateY(-30px) scale(1.06)'; // a spine pulled partway out of the shelf
const OPENED = 'rotateY(-115deg)';             // the cover swung open toward you
const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const spineOf = n => document.querySelector(`#shelves [data-bind="${CSS.escape(n)}"]`);
let shelfY = 0; // how far the shelf was scrolled when a binder came off it, to return to the same spot

// The layer the animation plays on: it dims the page behind and blocks taps until the animation ends.
function fxLayer() {
  const fx = Object.assign(document.createElement('div'), { className: 'fx' });
  fx.innerHTML = '<div class="fx-bg"></div>';
  document.body.append(fx);
  return fx;
}
const dim = (fx, on, ms, easing = 'linear') =>
  fx.firstChild.animate([{ opacity: on ? 0 : 1 }, { opacity: on ? 1 : 0 }], { duration: ms, easing, fill: 'forwards' }).finished;
// A copy of a spine placed exactly over the real one (which is hidden meanwhile).
function spineCopy(fx, spine) {
  // a leaning spine: measure it upright, then give the copy the same lean so nothing snaps at the end
  const m = new DOMMatrix(getComputedStyle(spine).transform), lean = Math.atan2(m.b, m.a) * 180 / Math.PI;
  spine.style.transform = 'none';
  const r = spine.getBoundingClientRect(), copy = spine.cloneNode(true);
  spine.style.transform = '';
  Object.assign(copy.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', visibility: '', transform: '',
                              rotate: lean + 'deg', transformOrigin: 'bottom left' });
  spine.style.visibility = 'hidden';
  fx.append(copy);
  return copy;
}
// A full-size binder cover laid over the open binder (its header down to the page arrows).
function coverOver(fx, name) {
  const head = $('#head').getBoundingClientRect();
  const r = { left: head.left, top: head.top, width: head.width, height: Math.min($('#binder').getBoundingClientRect().bottom, innerHeight - 80) - head.top };
  const book = Object.assign(document.createElement('div'), { className: 'fx-book cover' });
  book.style.cssText = `--c:${colorOf(name)[0]};left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
  book.innerHTML = `<span class="t">${esc(name)}</span><span class="zip"></span>`;
  fx.append(book);
  return { book, r };
}
// The transform that squeezes the cover (at rect r) down onto a lifted spine (at rect s), turned edge-on.
const ontoSpine = (r, s) => `translate(${s.left - r.left}px,${s.top - r.top}px) scale(${s.width / r.width},${s.height / r.height}) rotateY(60deg)`;

async function openBinder(spine) {
  if ($('.fx')) return; // one at a time
  const name = spine.dataset.bind;
  const show = () => { cur = name; page = 0; render(); scrollTo(0, 0); };
  shelfY = scrollY;
  if (!still()) {
    const fx = fxLayer();
    try {
      // 1. pull: the spine rises out of the shelf while the room dims
      const copy = spineCopy(fx, spine);
      await Promise.all([copy.animate([{ transform: 'none' }, { transform: LIFT }], { duration: MS.pull, easing: EASE, fill: 'forwards' }).finished, dim(fx, true, MS.pull)]);
      // 2. turn: swap the binder in underneath, then grow it from the lifted spine to full size
      const s = copy.getBoundingClientRect();
      copy.remove(); show();
      const { book, r } = coverOver(fx, name);
      book.style.transformOrigin = 'top left';
      await book.animate([{ transform: ontoSpine(r, s) }, { transform: 'none' }], { duration: MS.turn, easing: EASE }).finished;
      // 3. open: the cover swings toward you on its left edge and the pages show through
      book.style.transformOrigin = 'left center';
      await Promise.all([book.animate([{ transform: 'none', opacity: 1 }, { transform: OPENED, opacity: 0 }], { duration: MS.open, easing: SWING }).finished,
                         dim(fx, false, MS.open, 'ease-in')]);
    } finally { fx.remove(); } // never leave the tap-blocking layer up, even if a step fails
  }
  if (cur !== name) show();
  $('#back').focus({ preventScroll: true }); // keyboard users land inside the binder, on its way back out
}

async function closeBinder() {
  if ($('.fx')) return;
  const name = cur;
  const back = () => { cur = 'All'; render(); scrollTo(0, shelfY); spineOf(name)?.scrollIntoView({ block: 'nearest' }); };
  if (!still()) {
    const fx = fxLayer();
    try {
      // 1. close: the cover swings shut over the pages while the room dims
      const { book, r } = coverOver(fx, name);
      book.style.transformOrigin = 'left center';
      await Promise.all([book.animate([{ transform: OPENED, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: MS.open, easing: SWING }).finished,
                         dim(fx, true, MS.open, 'ease-out')]);
      // 2. turn: swap the shelf in underneath, then shrink the binder down onto its spine, held just above its slot
      back();
      const spine = spineOf(name), copy = spineCopy(fx, spine);
      copy.style.transform = LIFT; copy.style.visibility = 'hidden';
      const s = copy.getBoundingClientRect();
      book.style.transformOrigin = 'top left';
      await book.animate([{ transform: 'none' }, { transform: ontoSpine(r, s) }], { duration: MS.turn, easing: EASE, fill: 'forwards' }).finished;
      // 3. slide: the spine drops back into its slot as the room brightens
      book.remove(); copy.style.visibility = '';
      await Promise.all([copy.animate([{ transform: LIFT }, { transform: 'none' }], { duration: MS.pull, easing: EASE, fill: 'forwards' }).finished,
                         dim(fx, false, MS.pull)]);
    } finally { fx.remove(); }
  }
  if (cur !== 'All') back();
  const spine = spineOf(name);
  if (spine) { spine.style.visibility = ''; spine.focus({ preventScroll: true }); } // focus returns to the binder you came from
}
$('#back').onclick = closeBinder;

// --- Binder pages: 9 pockets each; only the page on screen and its neighbours hold images ---
const gainOf = c => ((c.price || 0) - (c.cost ?? c.price ?? 0)) * c.qty;
const SORTS = { value: (a, b) => value(b) - value(a), gain: (a, b) => gainOf(b) - gainOf(a),
                name: (a, b) => byName(a.name, b.name), added: (a, b) => b.added - a.added };
const HOLES = '<div class="holes" aria-hidden="true"><i></i><i></i><i></i></div>';
const pageCount = () => Math.max(1, Math.ceil(view.length / 9));

function renderPages(reset) {
  view = cards.filter(c => c.col === cur).sort(SORTS[$('#sort').value]);
  if (reset) page = 0;
  page = Math.min(page, pageCount() - 1);
  const el = $('#pages');
  el.innerHTML = Array.from({ length: pageCount() }, (_, i) => `<div class="sheet" data-p="${i}">${HOLES}</div>`).join('');
  fillAround();
  el.scrollLeft = page * el.clientWidth;
  syncPager();
}
function pocketHTML(c) {
  if (!c) return '<div class="pocket empty" aria-hidden="true"></div>';
  const ch = c.prevPrice && c.price ? (c.price - c.prevPrice) / c.prevPrice * 100 : 0;
  const info = [c.name, c.set, c.variant !== 'none' && c.variant, c.grader ? `${c.grader} ${c.grade ?? ''}` : c.cond,
                c.qty > 1 && `${c.qty} copies`, usd(c.price) + ' each', ch && `${ch > 0 ? '+' : ''}${ch.toFixed(1)}% since last refresh`,
                c.manual != null && 'your value'].filter(Boolean).join(' · ');
  return `<div class="pocket" role="button" tabindex="0" data-key="${esc(c.key)}" title="${esc(info)}" aria-label="${esc(info)}">
    ${c.thumb ? `<img src="${esc(c.thumb)}" alt="" data-name="${esc(c.name)}" loading="lazy" decoding="async">` : `<span class="noimg">${esc(c.name)}</span>`}
    ${c.qty > 1 ? `<span class="qty">×${c.qty}</span>` : ''}${c.grader ? `<span class="slab">${esc(c.grader)} ${esc(c.grade ?? '')}</span>` : ''}
    <span class="tag">${tagUsd(c.price)}${ch ? `<i class="${ch > 0 ? 'up' : 'down'}">${ch > 0 ? '▲' : '▼'}</i>` : ''}</span></div>`;
}
// ponytail: a 5,000-card binder is ~560 sheets; empty sheets are tiny, so only ±1 page gets pockets and far ones are emptied.
function fillAround() {
  for (const s of $('#pages').children) {
    const i = +s.dataset.p, near = Math.abs(i - page) <= 1;
    if (near && !s.dataset.full) {
      s.innerHTML = HOLES + `<div class="grid9">${Array.from({ length: 9 }, (_, j) => pocketHTML(view[i * 9 + j])).join('')}</div>`;
      s.dataset.full = 1;
    } else if (!near && s.dataset.full && Math.abs(i - page) > 2) { s.innerHTML = HOLES; delete s.dataset.full; }
  }
}
function syncPager() {
  const n = pageCount();
  $('#pg').textContent = view.length ? `Page ${page + 1} of ${n}` : 'Empty binder · add cards from Search';
  $('#prev').disabled = page === 0; $('#next').disabled = page >= n - 1;
}
$('#pages').onscroll = () => {
  const el = $('#pages'), i = Math.round(el.scrollLeft / el.clientWidth);
  if (i !== page && i >= 0) { page = i; fillAround(); syncPager(); }
};
const smooth = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
const flip = d => { const el = $('#pages'); el.scrollTo({ left: (page + d) * el.clientWidth, behavior: smooth() }); };
$('#prev').onclick = () => flip(-1);
$('#next').onclick = () => flip(1);
$('#pages').onclick = e => { const p = e.target.closest('[data-key]'); if (p) openCard(null, null, cards.find(c => c.key === p.dataset.key)); };

function renderProfile() {
  $('#pName').value = profile.name ?? ''; $('#pEmail').value = profile.email ?? '';
  $('#pPhoto').src = profile.photo || ''; $('#pPhoto').classList.toggle('hidden', !profile.photo);
  $('#pInitials').textContent = profile.photo ? '' : [...(profile.name || '?')][0].toUpperCase(); // [...s] keeps an emoji whole
  $('#pPhotoDel').classList.toggle('hidden', !profile.photo);
}

// Refresh fetches each distinct card once (copies in other conditions/binders share it), in batches where the API allows.
async function refresh() {
  const btn = $('#refresh'), groups = {};
  for (const c of cards) if (sources[c.game]) (groups[c.game] ??= new Set()).add(String(c.id));
  const total = Object.values(groups).reduce((s, g) => s + g.size, 0);
  if (!total) return $('#status').textContent = 'Nothing to refresh: sports and custom cards use your own value.';
  let done = 0;
  const tick = n => { done += n; btn.textContent = `Refreshing ${done}/${total}…`; };
  btn.disabled = true; details.clear();
  try {
    const prices = Object.fromEntries(await Promise.all(Object.entries(groups).map(async ([g, ids]) => [g, await sources[g].getMany([...ids], tick)])));
    for (const c of cards) {
      const m = prices[c.game]?.get(String(c.id))?.[c.variant];
      if (m == null) continue;
      c.market = m; c.prevPrice = c.price; c.price = unitPrice(c);
    }
    commit();
    const got = Object.values(prices).reduce((s, m) => s + m.size, 0);
    $('#status').textContent = got === total ? `Updated ${total} cards.`
      : got ? `Updated ${got} of ${total} cards. The rest couldn't be reached; try again later.`
      : "Couldn't reach the price sites. Check your connection and try again.";
  } finally { btn.disabled = false; btn.textContent = 'Refresh prices'; }
}

// --- Add / edit dialog ---
async function openCard(g, id, existing) {
  let d = existing;
  if (d) editPrices = d.market != null ? { [d.variant]: d.market } : {};
  else if (g === 'custom') { d = { game: g, name: $('#q').value.trim(), set: '', img: '', thumb: '' }; editPrices = {}; }
  else { const { prices, ...info } = await getCard(g, id); d = { game: g, id, ...info }; editPrices = prices; }
  editing = d;
  const custom = d.game === 'custom';
  $('#dImg').src = d.img || ''; $('#dLoader').classList.toggle('hidden', !d.img);
  $('#dName').textContent = d.name; $('#dSet').textContent = d.set;
  $('#dTitle').classList.toggle('hidden', custom); $('#dCustom').classList.toggle('hidden', !custom);
  $('#cName').required = custom; $('#cName').value = d.name; $('#cSet').value = d.set; $('#cImg').value = d.img;
  $('#dVariantWrap').classList.toggle('hidden', custom);
  fillVariants(existing?.variant);
  $('#dCol').innerHTML = collections.map(n => `<option>${esc(n)}</option>`).join('');
  $('#dCol').value = existing?.col ?? (cur === 'All' ? collections[0] : cur);
  $('#dQty').value = existing?.qty ?? 1;
  $('#dCond').value = existing?.cond ?? 'Near Mint';
  $('#dGrader').value = existing?.grader ?? ''; $('#dGrade').value = existing?.grade ?? '';
  $('#dManual').value = existing?.manual ?? '';
  $('#dCost').value = existing?.cost ?? '';
  $('#dDelete').classList.toggle('hidden', !existing);
  syncManual();
  $('#dlg').returnValue = ''; // Esc keeps the old returnValue otherwise
  $('#dlg').showModal();
  // Editing opens instantly with the stored price; the other printings load in behind it.
  if (existing && sources[d.game]) getCard(d.game, d.id).then(r => {
    if (editing !== d || !$('#dlg').open) return;
    editPrices = { ...r.prices, ...(r.prices[d.variant] == null && d.market != null && { [d.variant]: d.market }) };
    fillVariants($('#dVariant').value); syncManual();
  }).catch(e => console.warn('Could not load printings', e));
}
function fillVariants(selected) {
  const vs = Object.entries(editPrices);
  $('#dVariant').innerHTML = vs.length ? vs.map(([k, v]) => `<option value="${esc(k)}">${esc(k)} — ${usd(v)}</option>`).join('') : '<option value="none">No market price</option>';
  if (selected && editPrices[selected] != null) $('#dVariant').value = selected;
}
// No free source has graded or sports prices, so those need your own value.
function syncManual() {
  const need = editing?.game === 'custom' || !Object.keys(editPrices).length;
  $('#dManual').required = need;
  $('#manualHint').textContent = need ? '— required, no market price available' : $('#dGrader').value ? '— recommended: market price is for raw copies' : '';
}
$('#dGrader').onchange = syncManual;

const num = el => el.value === '' ? null : +el.value;
$('#dlg').addEventListener('close', async () => {
  const act = $('#dlg').returnValue, c = editing, prices = editPrices;
  editPrices = {};
  if (act === 'delete') {
    if (!await ask(`Remove ${c.name} from your collection?`)) return; // was one tap, no undo
    cards = cards.filter(x => x !== c);
  }
  if (act === 'save') {
    if (c.game === 'custom') { const img = $('#cImg').value.trim(); Object.assign(c, { name: $('#cName').value.trim(), set: $('#cSet').value.trim(), img, thumb: img }); }
    Object.assign(c, { variant: c.game === 'custom' ? 'none' : $('#dVariant').value, col: $('#dCol').value,
      qty: Math.max(1, Math.round(+$('#dQty').value) || 1), cond: $('#dCond').value, grader: $('#dGrader').value || null,
      grade: $('#dGrader').value ? num($('#dGrade')) : null, manual: num($('#dManual')), cost: num($('#dCost')) });
    c.market = prices[c.variant] ?? null;
    const p = unitPrice(c);
    if (p !== c.price) c.prevPrice = null; // a condition/value edit isn't a market move; don't show it as a % change
    c.price = p;
    if (!c.key) { c.key = crypto.randomUUID(); c.added = Date.now(); cards.push(c); }
  }
  if (act === 'save' || act === 'delete') commit();
});

// --- Search ---
$('#searchForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (game === 'custom') return openCard('custom');
  const q = $('#q').value.trim(); if (!q) return;
  searchCtl?.abort(); // a newer search cancels the one in flight, so a slow old answer can't overwrite it
  const ctl = searchCtl = new AbortController();

  } catch (err) { if (err.name !== 'AbortError') $('#searchMsg').textContent = `Search failed: ${why(err)}.`; }
});
$('#results').addEventListener('click', async e => {
  const el = e.target.closest('[data-id]');
  if (!el || $('#results').ariaBusy === 'true') return; // a second tap while loading used to open the dialog twice
  el.classList.add('busy'); $('#results').ariaBusy = 'true';

  catch (err) { tell(`Could not load card: ${why(err)}.`); }

});
document.querySelectorAll('[data-game]').forEach(b => b.onclick = () => {
  game = b.dataset.game; searchCtl?.abort();
  document.querySelectorAll('[data-game]').forEach(x => { x.classList.toggle('on', x === b); x.ariaPressed = x === b; });
  $('#results').innerHTML = '';
