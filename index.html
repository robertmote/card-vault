<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card Vault</title>
<!-- home-screen app: name, icon and full-screen launch when added from the phone's browser -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <section id="portfolio">
    <header class="head" id="head">
      <button class="iconbtn hidden" id="back" aria-label="Back to shelf">‹</button>
      <div class="grow">
        <div class="lbl" id="headLbl">Your collection</div>
        <div class="total" id="total">$0.00</div>
        <div id="change"></div>
      </div>
      <details class="menu hidden" id="menu">
        <summary class="iconbtn" aria-label="Binder options">⋯</summary>
        <div><button data-act="rename">Rename binder</button><button data-act="color">Change colour</button><button data-act="delete">Delete binder</button></div>
      </details>
      <span class="zip" aria-hidden="true"></span>
    </header>

    <div id="binder" class="hidden">
      <div class="pages" id="pages" aria-label="Binder pages"></div>
      <div class="pager">
        <button class="iconbtn" id="prev" aria-label="Previous page">‹</button>
        <span id="pg" aria-live="polite"></span>
        <button class="iconbtn" id="next" aria-label="Next page">›</button>
      </div>
    </div>

    <div class="panel">
      <svg id="chart" role="img" aria-label="Value chart" viewBox="0 0 300 100" preserveAspectRatio="none"></svg>
      <div class="ranges" id="ranges"></div>
    </div>
    <div class="panel stats">
      <div><b id="count">0</b><span>Cards</span></div>
      <div><b id="cost">$0</b><span>Cost basis</span></div>
      <div><b id="gain">$0</b><span>Gain / loss</span></div>
    </div>

    <div id="shelves"></div>

    <div class="bar" style="margin-top:14px">
      <select id="sort" style="width:auto" aria-label="Sort cards"><option value="value">Sort: value</option><option value="gain">Sort: gain</option><option value="name">Sort: name</option><option value="added">Sort: recently added</option></select>
      <span class="bar" style="margin-left:auto"><button class="btn ghost hidden" id="scanBinder">Scan</button><button class="btn" id="refresh">Refresh prices</button></span>
    </div>
    <p id="status" class="sub" aria-live="polite"></p>
    <div class="actions" style="justify-content:flex-start">
      <button class="btn ghost" id="export">Export backup</button>
      <label class="btn ghost" style="margin:0" role="button" tabindex="0">Import backup<input type="file" id="import" accept=".json" hidden></label>
    </div>
  </section>

  <section id="search" class="hidden">
    <div class="chips">
      <button class="chip on" aria-pressed="true" data-game="pokemon">Pokémon</button>
      <button class="chip" aria-pressed="false" data-game="mtg">Magic</button>
      <button class="chip" aria-pressed="false" data-game="ygo">Yu-Gi-Oh!</button>
      <button class="chip" aria-pressed="false" data-game="custom">Sports / Other</button>
    </div>
    <form id="searchForm" class="bar" style="flex-wrap:nowrap"><input id="q" type="search" aria-label="Search cards" placeholder="Search cards by name…" autocomplete="off" style="flex:1;min-width:0"><button type="button" class="btn ghost" id="scanOpen">Scan</button></form>
    <div class="mat">
      <p id="searchMsg" class="sub" aria-live="polite" style="margin-top:0">Search for a card, then tap it to add it to a binder.</p>
      <div class="grid" id="results"></div>
    </div>
  </section>

  <section id="profile" class="hidden">
    <div class="idcard">
      <div class="idtop">Card Vault · Collector ID</div>
      <div class="idbody">
        <div style="text-align:center">
          <label class="avatar" title="Change photo" role="button" tabindex="0" aria-label="Change profile photo"><img id="pPhoto" alt=""><span id="pInitials"></span><input type="file" id="pPhotoIn" accept="image/*" hidden></label>
          <button class="linkbtn" id="pPhotoDel">Remove photo</button>
        </div>
        <div style="flex:1;display:grid;gap:8px">
          <input id="pName" placeholder="Username" maxlength="30" autocomplete="nickname" aria-label="Username">
          <input id="pEmail" type="email" placeholder="Email address" autocomplete="email" aria-label="Email address">
        </div>
      </div>
      <div class="idstats">
        <div><b id="pCount">0</b><span>Total cards</span></div>
        <div><b id="pValue">$0.00</b><span>Combined value</span></div>
      </div>
    </div>
    <div class="panel"><h1 style="margin-bottom:4px">By binder</h1><div id="pByCol"></div></div>
    <div class="panel"><h1 style="margin-bottom:4px">By game</h1><div id="pByGame"></div></div>
  </section>
</main>

<nav class="tabs" aria-label="Sections">
  <button class="on" aria-current="page" data-tab="portfolio">Binders</button>
  <button data-tab="search">Search</button>
  <button data-tab="profile">Profile</button>
</nav>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <div class="loader" id="dLoader"><img id="dImg" alt=""></div>
    <div id="dTitle" class="dtitle"><b id="dName"></b><div id="dSet" class="sub"></div></div>
    <div class="tagform">
      <div id="dCustom">
        <label for="cName">Card name</label><input id="cName" placeholder="e.g. 2018 Prizm Luka Doncic #280">
        <label for="cSet">Set / year</label><input id="cSet" placeholder="optional">
        <label for="cImg">Image URL</label><input id="cImg" type="url" placeholder="optional">
      </div>
      <div id="dVariantWrap"><label for="dVariant">Variant / printing</label><select id="dVariant"></select></div>
      <label for="dCol">Binder</label><select id="dCol"></select>
      <div class="two">
        <div><label for="dQty">Quantity</label><input id="dQty" type="number" min="1" step="1" value="1" inputmode="numeric"></div>
        <div><label for="dCond">Condition</label><select id="dCond"></select></div>
      </div>
      <div class="two">
        <div><label for="dGrader">Grading</label><select id="dGrader"><option value="">Raw (ungraded)</option><option>PSA</option><option>BGS</option><option>CGC</option><option>SGC</option></select></div>
        <div><label for="dGrade">Grade</label><input id="dGrade" type="number" min="1" max="10" step="0.5" placeholder="e.g. 10"></div>
      </div>
      <label for="dManual">Your value (each, USD) <span id="manualHint"></span></label><input id="dManual" inputmode="decimal" type="number" min="0" step="0.01" placeholder="leave blank to use market price">
      <label for="dCost">Purchase price (each, USD)</label><input id="dCost" inputmode="decimal" type="number" min="0" step="0.01" placeholder="optional">
      <div class="actions">
        <!-- type="button" so pressing Enter in a field triggers Save, not the first button -->
        <button type="button" class="btn ghost hidden" id="dDelete" style="margin-right:auto;color:#a8392c" onclick="this.closest('dialog').close('delete')">Remove</button>
        <button type="button" class="btn ghost" onclick="this.closest('dialog').close()">Cancel</button>
        <button class="btn" value="save">Save</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="scan" class="scan" aria-label="Card scanner">
  <video id="scanVid" playsinline muted></video>
  <div class="guide"><i></i><i></i><i></i><i></i><p class="readout" id="readout" aria-live="polite"></p></div>
  <div class="scantop">
    <button type="button" class="iconbtn" id="scanClose" aria-label="Close scanner" onclick="this.closest('dialog').close()">✕</button>
    <div class="seg" role="group" aria-label="Scan mode"><button type="button" data-mode="check">Price check</button><button type="button" data-mode="add">Add to binder</button></div>
    <button type="button" class="iconbtn hidden" id="torch" aria-label="Flash" aria-pressed="false">⚡</button>
  </div>
  <div class="scanopts">
    <select id="scanGame" aria-label="Game"><option value="pokemon">Pokémon</option><option value="mtg">Magic</option><option value="ygo">Yu-Gi-Oh!</option><option value="custom">Sports / Other</option></select>
    <select id="scanCol" aria-label="Add to binder"></select>
    <select id="scanCond" aria-label="Condition"></select>
    <label class="btn" role="button" tabindex="0">Use a photo<input type="file" id="scanPhoto" accept="image/*" hidden></label>
  </div>
  <div class="scansheet" id="scanSheet"><div class="note hidden" id="note" role="status"></div><div id="sheetBody"></div></div>
</dialog>

<dialog id="ask">
  <form method="dialog">
    <p id="askMsg"></p>
    <input id="askIn" aria-labelledby="askMsg" maxlength="40" autocomplete="off">
    <div id="askColors" class="swatches" role="radiogroup" aria-label="Binder colour"></div>
    <div class="actions">
      <button type="button" class="btn ghost" id="askCancel" onclick="this.closest('dialog').close()">Cancel</button>
      <button class="btn" value="ok">OK</button>
    </div>
  </form>
</dialog>

<!-- plain scripts (not modules) so the app also runs when index.html is opened straight from a folder; order matters -->
<script src="js/core.js"></script>
<script src="js/prices.js"></script>
<script src="js/portfolio.js"></script>
<script src="js/binders.js"></script>
<script src="js/binder-animation.js"></script>
<script src="js/cards.js"></script>
<script src="js/scanner.js"></script>
<script src="js/profile.js"></script>
<script src="js/main.js"></script>
</body>
</html>
